<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin | PAVAN.DEV</title><link rel="stylesheet" href="Style.css"><style>
.admin-shell{max-width:920px;margin:110px auto 60px;padding:24px}.admin-panel{background:var(--light-color);padding:28px;border-radius:18px;box-shadow:var(--shadow);margin:20px 0}.admin-panel input,.admin-panel textarea{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid var(--border-color);border-radius:8px;font:inherit}.admin-panel button{margin:6px 6px 6px 0}.admin-list article{padding:14px 0;border-bottom:1px solid var(--border-color)}.muted{color:var(--light-text)}#admin-status{min-height:1.5em}
</style></head><body><main class="admin-shell"><a href="/Portfolio.html">← Back to portfolio</a><h1>Portfolio Admin</h1><p class="muted">Sign in to manage portfolio projects and review contact messages.</p><p id="admin-status" role="status" aria-live="polite"></p>
<section id="login-panel" class="admin-panel"><h2>Admin login</h2><form id="login-form"><input name="username" autocomplete="username" placeholder="Username" required><input name="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn-primary" type="submit">Sign in</button></form></section>
<section id="dashboard" hidden><div class="admin-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Add project</h2><button id="logout" class="btn-secondary">Sign out</button></div><form id="project-form">
<input name="title" placeholder="Project title" maxlength="120" required><textarea name="description" placeholder="Short description" maxlength="1000" required></textarea><input name="category" placeholder="Categories e.g. html js responsive" required><input name="badge" placeholder="Badge e.g. JavaScript" required><input name="technologies" placeholder="Technologies, comma separated" required><input name="date" placeholder="Date / year"><input name="image" placeholder="Image path or URL"><input name="demo" placeholder="Demo URL"><input name="code" placeholder="Source code URL"><button class="btn-primary" type="submit">Publish project</button></form></div>
<div class="admin-panel"><h2>Projects</h2><div id="project-list" class="admin-list"></div></div>
<div class="admin-panel"><h2>Contact messages</h2><div id="message-list" class="admin-list"></div></div></section></main><script src="admin.js"></script></body></html>
